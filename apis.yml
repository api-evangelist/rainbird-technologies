aid: rainbird-technologies
name: Rainbird Technologies
description: >-
  Rainbird Technologies is an AI decision automation platform for regulated industries
  (banking and finance, insurance, tax and audit, healthcare, and law). It turns
  regulations, policies, and expert knowledge into deterministic, fully auditable
  decision systems using symbolic reasoning over knowledge graphs (Knowledge Maps),
  promising zero hallucinations and explainable, evidence-backed outcomes. The
  Rainbird API lets developers query a published Knowledge Map by starting a session,
  injecting known facts, running queries, answering the questions the engine asks,
  and retrieving the evidence chain behind every decision. Community and Enterprise
  hosting environments are offered, with first-party JavaScript/React and Go SDKs.
