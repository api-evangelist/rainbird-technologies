apis:
- aid: rainbird-technologies:rainbird-technologies-decisions-api
  name: Rainbird Technologies Decisions API
  description: >-
    Get decisions from your knowledge maps. **Start** a session, **inject** any available facts, run a
    **query**, provide a **response** to any questions asked and **undo** your answers to give a different
    response.<br><br> **Note:** query, response and undo endpoints can all return *either* a **questionResponse**
    (the reasoning engine needs more information) *or* a **resultResponse** (the decision).<br><br> Alternatively
    you can **interact** with the reasoning engine via natural language. This is in beta, is subject to
    change and responses may vary due to natural language interpretation.
  humanURL: https://docs.rainbird.ai/rainbird/developer-docs/overview
